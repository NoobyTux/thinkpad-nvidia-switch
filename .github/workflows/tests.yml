name: Code checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Tests (Python ${{ matrix.python-version }})
    # Pinned on purpose: "ubuntu-latest" moved to Ubuntu 26.04, for which GitHub publishes no Python 3.9
    # ("The version '3.9' ... was not found for Ubuntu 26.04"). The project still supports Python 3.9.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check shell syntax
        run: bash -n install.sh uninstall.sh src/optimus_auto_off_wrapper.sh src/optimus_restore_wrapper.sh
      - name: Check Python syntax
        run: python -m compileall -q src tests
      - name: Run hardware-independent unit tests
        # The Qt tests skip themselves here (no PySide6); the "gui" job runs them.
        run: python -m unittest discover -s tests -v

  lint:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: ShellCheck
        run: shellcheck --severity=warning install.sh uninstall.sh src/optimus_auto_off_wrapper.sh src/optimus_restore_wrapper.sh
      - name: Ruff (pyflakes rules and syntax errors, configured in pyproject.toml)
        run: |
          python -m pip install ruff
          ruff check .

  gui:
    name: Qt interface tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PySide6 and the system libraries Qt needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core
          python -m pip install PySide6-Essentials
      - name: Run the tests, including the offscreen window tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
